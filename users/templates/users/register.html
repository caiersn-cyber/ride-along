{% extends 'users/base.html' %}
{% load crispy_forms_tags %}
{% block extra_nav %}border-bottom shadow{% endblock %}
{% block content %}
    <div class="container">
        <form method="post">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend>注册</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">注册</button>
            </div>
        </form>
        <div>
            <small>
                已有账号？
                <a href="{% url 'login' %}">点击此处登录</a>
            </small>
        </div>
    </div>
{% endblock content %}
