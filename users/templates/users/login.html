{% extends 'users/base.html' %}
{% load crispy_forms_tags %}
{% block extra_nav %}border-bottom shadow{% endblock %}
{% block content %}
    <div class="container">
        <form method="post">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend>登录</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-dark" type="submit">登录</button>
            </div>
        </form>
        <div>
            <small>
                没有账号？
                <a href="{% url 'register' %}">点击此处注册</a>
            </small>
        </div>
    </div>
{% endblock content %}
